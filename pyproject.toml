[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot"
version = "0.1.0"
description = "Batch-aware patch scheduling, Salt-driven patching and automated post-patch validation"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "tzdata",            # IANA time zones on Windows, where the OS has no tz database
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
ai = ["anthropic"]
dev = ["pytest>=8"]

[project.scripts]
patchpilot = "patchpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
